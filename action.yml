name: 'IIS Versioned Deploy'
description: 'Allows to deploy a website on IIS with less downtime by using rotational folders. Supports Site and/or Site/VirtualApp'
inputs:
  website-name:
    description: "IIS website name"
    required: false
    default: ''
  site-name:
    description: "Deprecated alias for website-name"
    required: false
    default: ''
  app-name:
    description: "IIS site application name (eg: Virtual application name)"
    required: false
    default: ''
  source-path:
    description: "The path to the source directory that will be deployed"
    required: true
  destination-path:
    description: "The parent path where versioned release folders are created. Defaults to the parent folder of the current site directory."
    required: false
    default: ''
  release-prefix:
    description: "Prefix used for the versioned release folders (e.g. 'r_' produces r_1, r_2, ...)"
    required: false
    default: 'r_'
  number-to-keep:
    description: "Total number of release folders to retain, including the current deployment"
    required: false
    default: '4'

runs:
  using: "composite"
  steps:
    - name: Deploy Application ${{ inputs.website-name != '' && inputs.website-name || inputs.site-name }} ${{ inputs.app-name }} on IIS
      shell: powershell
      run: |
        $effectiveSiteName = if (-not [string]::IsNullOrWhiteSpace('${{ inputs.website-name }}')) { '${{ inputs.website-name }}' } else { '${{ inputs.site-name }}' }
        $deployArgs = @{
          sourceDir = '${{ inputs.source-path }}'
          siteName = $effectiveSiteName
          keep = '${{ inputs.number-to-keep }}'
        }

        if (-not [string]::IsNullOrWhiteSpace('${{ inputs.destination-path }}')) {
          $deployArgs.releaseParentDir = '${{ inputs.destination-path }}'
        }

        if (-not [string]::IsNullOrWhiteSpace('${{ inputs.release-prefix }}')) {
          $deployArgs.releasePrefix = '${{ inputs.release-prefix }}'
        }

        if (-not [string]::IsNullOrWhiteSpace('${{ inputs.app-name }}')) {
          $deployArgs.appName = '${{ inputs.app-name }}'
        }

        & "${{ github.action_path }}/scripts/deploy.ps1" @deployArgs
branding:
  icon: upload-cloud
  color: blue
